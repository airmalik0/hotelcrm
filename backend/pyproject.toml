[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "python-multipart<1.0.0,>=0.0.7",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "tenacity<9.0.0,>=8.2.3",
    "pydantic>2.0",
    "alembic<2.0.0,>=1.12.1",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel<1.0.0,>=0.0.21",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.3.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "sentry-sdk[fastapi]>=1.40.6,<2.0.0",
    "pyjwt<3.0.0,>=2.8.0",
    "requests>=2.32.5",
    "pandas>=2.3.2",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.6",
    "seaborn>=0.13.2",
    "reportlab>=4.4.3",
    "python-dateutil>=2.9.0.post0",
    "apscheduler>=3.10.4",
    "slowapi>=0.1.9",
]

[tool.uv]
dev-dependencies = [
    "pytest<8.0.0,>=7.4.3",
    "mypy<2.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit>=3.6.2,<4.0.0",
    "types-passlib<2.0.0.0,>=1.7.7.20240106",
    "coverage<8.0.0,>=7.4.3",
    "isort>=6.0.1",
    "types-openpyxl>=3.1.5.20250822",
    "types-requests>=2.32.4.20250809",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
implicit_reexport = true

# Ignore SQLModel/SQLAlchemy type issues that can't be fixed
[[tool.mypy.overrides]]
module = "app.crud.*"
ignore_errors = true

# Ignore matplotlib type issues
[[tool.mypy.overrides]]
module = "app.services.chart_service"
ignore_errors = true

# Ignore SQLModel session.exec issues
[[tool.mypy.overrides]]
module = "app.crud.analytics"
ignore_errors = true

# Ignore import service CSV parsing complexity
[[tool.mypy.overrides]]
module = "app.services.import_service"
ignore_errors = true



# Ignore test scripts - not production code
[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

# Ignore audit service - SQLModel typing issues
[[tool.mypy.overrides]]
module = "app.services.audit"
ignore_errors = true

[tool.ruff]
target-version = "py310"
exclude = ["alembic", "scripts"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]
per-file-ignores = {"app/models/__init__.py" = ["F401", "I001"]}

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true
